[project]
name = "multi-agent-games"
version = "0.1.0"
description = "Sandbox for multi-agent game-theory experiments with LLM agents: when do models help others at a cost to themselves, defect, or collude?"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/multi_agent_games"]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
extend-select = ["I"]   # isort — ruff owns import ordering too

[dependency-groups]
dev = [
    "ruff>=0.16.8",
    "ty>=0.0.83",
]
